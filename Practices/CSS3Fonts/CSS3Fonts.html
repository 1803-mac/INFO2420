<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSS3 Embedded Fonts</title>

<style type="text/css">

@font-face{
	font-family:'DarkH4';
	src: url('fonts/DarkH4.eot'); 
	src: local('DarkH4'), url('fonts/DarkH4.ttf') format('truetype') ;
   
}



p{
	font-family:DarkH4, Geneva, serif;
	font-size: 36px;

}

</style>


</head>
<body>

<p>
	What is your favorite Western movie?  This font is called DarkH4.  Does it make you think of the wild, wild West?
</p>



</body></html>
